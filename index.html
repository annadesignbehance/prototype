<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>SkillUp Academy — светлая / тёмная</title>
<meta name="viewport" content="width=1400">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&display=swap" rel="stylesheet">
<style>
  *,*:before,*:after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #EAECEF;
    font-family: 'Manrope', system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
  }
  .stage {
    position: relative;
    width: 100vw; height: 100vh;
    user-select: none;
    -webkit-user-select: none;
    cursor: ew-resize;
    touch-action: none;
    overflow: hidden;
  }
  .layer {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    gap: 22px;
    padding: 0 20px;
  }
  .layer.light { background: #EAECEF; }
  .layer.dark  { background: #2B2B2B; }
  .phone {
    width: clamp(180px, 19vw, 260px);
    aspect-ratio: 280 / 606;
    background: #1B1F26;
    border-radius: 30px;
    padding: 8px;
    flex-shrink: 1;
    box-shadow: 0 30px 60px rgba(0,0,0,.18);
    position: relative;
  }
  .layer.dark .phone {
    background: #0F1318;
    box-shadow: 0 30px 60px rgba(0,0,0,.45);
  }
  .phone .screen {
    width: 100%; height: 100%;
    border-radius: 26px;
    overflow: hidden;
    background: #fff;
  }
  .layer.dark .phone .screen { background: #0F1318; }
  .phone .screen img {
    display: block; width: 100%; height: 100%;
    object-fit: cover; object-position: top center;
  }
  .phone .home-bar {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    width: 84px; height: 3px; border-radius: 2px;
    background: #1B1F26; z-index: 3;
  }
  .layer.dark .phone .home-bar { background: #ECEFF4; }
  .label {
    position: absolute; top: 28px;
    font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
    z-index: 7;
    transition: opacity .2s;
  }
  .label.light { left: 28px; color: #7A8395; }
  .label.dark  { right: 28px; color: rgba(255,255,255,.75); }
  .divider {
    position: absolute; top: 0; bottom: 0;
    left: 50%; width: 2px;
    background: #fff;
    transform: translateX(-50%);
    box-shadow: 0 0 0 1px rgba(0,0,0,.18);
    z-index: 8;
    pointer-events: none;
  }
  .handle {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 56px; height: 56px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 6px 22px rgba(0,0,0,.35);
    display: flex; align-items: center; justify-content: center;
    z-index: 9;
    cursor: ew-resize;
  }
  .hint {
    position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%);
    z-index: 7;
    background: rgba(0,0,0,.5); color: #fff;
    padding: 7px 16px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
    letter-spacing: .04em;
    pointer-events: none;
    transition: opacity .25s;
  }
</style>
</head>
<body>
<div class="stage" id="stage">

  <span class="label light" id="lblLight">Light</span>
  <span class="label dark" id="lblDark">Dark</span>

  <div class="layer light">
    <div class="phone"><div class="screen"><img src="images/light-1.png" alt=""></div><div class="home-bar"></div></div>
    <div class="phone"><div class="screen"><img src="images/light-2.png" alt=""></div><div class="home-bar"></div></div>
    <div class="phone"><div class="screen"><img src="images/light-3.png" alt=""></div><div class="home-bar"></div></div>
    <div class="phone"><div class="screen"><img src="images/light-4.png" alt=""></div><div class="home-bar"></div></div>
  </div>

  <div class="layer dark" id="darkLayer" style="clip-path: inset(0 0 0 50%);">
    <div class="phone"><div class="screen"><img src="images/dark-1.png" alt=""></div><div class="home-bar"></div></div>
    <div class="phone"><div class="screen"><img src="images/dark-2.png" alt=""></div><div class="home-bar"></div></div>
    <div class="phone"><div class="screen"><img src="images/dark-3.png" alt=""></div><div class="home-bar"></div></div>
    <div class="phone"><div class="screen"><img src="images/dark-4.png" alt=""></div><div class="home-bar"></div></div>
  </div>

  <div class="divider" id="divider"></div>
  <div class="handle" id="handle" style="left: 50%;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <path d="M9 6l-4 6 4 6" stroke="#14181F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="M15 6l4 6-4 6" stroke="#14181F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
  </div>

  <span class="hint" id="hint">← потяните, чтобы сравнить →</span>
</div>

<script>
  function initSlider() {
    const stage    = document.getElementById('stage');
    const darkLay  = document.getElementById('darkLayer');
    const divider  = document.getElementById('divider');
    const handle   = document.getElementById('handle');
    const hint     = document.getElementById('hint');
    const lblLight = document.getElementById('lblLight');
    const lblDark  = document.getElementById('lblDark');
    if (!stage) return;

    let pos = 50;
    let dragging = false;

    function apply() {
      darkLay.style.clipPath = `inset(0 0 0 ${pos}%)`;
      divider.style.left = pos + '%';
      handle.style.left  = pos + '%';
      lblLight.style.opacity = pos > 12 ? 1 : 0;
      lblDark.style.opacity  = pos < 88 ? 1 : 0;
      hint.style.opacity = (pos > 48 && pos < 52) ? .85 : 0;
    }
    apply();

    function update(clientX) {
      const r = stage.getBoundingClientRect();
      pos = Math.max(0, Math.min(100, ((clientX - r.left) / r.width) * 100));
      apply();
    }

    stage.addEventListener('pointerdown', (e) => { dragging = true; update(e.clientX); e.preventDefault(); });
    window.addEventListener('pointermove', (e) => { if (dragging) update(e.clientX); });
    window.addEventListener('pointerup', () => { dragging = false; });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initSlider);
  } else { initSlider(); }
</script>
</body>
</html>
